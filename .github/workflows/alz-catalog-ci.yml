name: ALZ Catalog CI

on:
  pull_request:
    paths:
      - "azure-terraform/alz-module-catalog/**"
      - ".github/workflows/alz-catalog-ci.yml"
  push:
    branches: [main]
    paths:
      - "azure-terraform/alz-module-catalog/**"
      - ".github/workflows/alz-catalog-ci.yml"

permissions:
  contents: read
  actions: read
  security-events: write

env:
  CATALOG: azure-terraform/alz-module-catalog

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -check -recursive "$CATALOG/modules" "$CATALOG/patterns" "$CATALOG/implementations"

  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # Every module + pattern dir that has .tf files (skip network-peering:
          # needs configuration_aliases, validated via its implementation).
          mapfile -t dirs < <(
            find "$CATALOG/modules" "$CATALOG/patterns" -maxdepth 1 -mindepth 1 -type d \
              | while read -r d; do ls "$d"/*.tf >/dev/null 2>&1 && echo "$d"; done \
              | grep -v 'terraform-azurerm-compeer-network-peering$' \
              | sort
          )
          printf 'dirs=%s\n' "$(printf '%s\n' "${dirs[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  validate-test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false -input=false -no-color
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate -no-color
      - name: terraform test
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -d tests ] && ls tests/*.tftest.hcl >/dev/null 2>&1; then
            terraform test -no-color
          else
            echo "no tests/ - skipped"
          fi

  workspaces-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ws:
          - platform-governance
          - platform-subscription-onboarding
          - platform-policy
          - platform-management
          - platform-connectivity
          - platform-identity-security
          - platform-hybrid-connectivity
          - platform-palo-alto
          - platform-directory-services
          - platform-cloudflare-connectors
          - platform-cloudflare-edge
          - platform-network-peering
          - platform-shared-services
          - platform-workload-spoke
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: init + validate
        working-directory: azure-terraform/alz-module-catalog/implementations/platform-lz/workspaces/${{ matrix.ws }}
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.0
      - name: tflint
        working-directory: ${{ env.CATALOG }}
        run: |
          tflint --init
          tflint --recursive --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install checkov
        run: python -m pip install --upgrade pip "checkov==3.2.500"
      - name: run checkov
        shell: bash
        env:
          SARIF: ${{ runner.temp }}/checkov-alz-catalog.sarif
        run: |
          set +e
          checkov -d "./$CATALOG/patterns" -d "./$CATALOG/implementations" \
            --framework terraform --compact --download-external-modules false -o cli
          cli=$?
          checkov -d "./$CATALOG/patterns" -d "./$CATALOG/implementations" \
            --framework terraform --compact --download-external-modules false \
            -o sarif --output-file-path "$SARIF"
          set -e
          [ "$cli" -eq 0 ] || exit "$cli"
      - uses: github/codeql-action/upload-sarif@v3
        if: success() || failure()
        with:
          sarif_file: ${{ runner.temp }}/checkov-alz-catalog.sarif
          category: checkov-alz-catalog

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
