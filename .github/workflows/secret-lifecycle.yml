name: Secret lifecycle verification
on:
  push:
    branches: [main]
    paths:
      - azure-terraform/alz-module-catalog/patterns/terraform-azurerm-compeer-secret-lifecycle/**
      - azure-terraform/alz-module-catalog/implementations/platform-lz/workspaces/platform-secret-lifecycle/**
      - .github/workflows/secret-lifecycle.yml
  pull_request:
    paths:
      - azure-terraform/alz-module-catalog/patterns/terraform-azurerm-compeer-secret-lifecycle/**
      - azure-terraform/alz-module-catalog/implementations/platform-lz/workspaces/platform-secret-lifecycle/**
      - .github/workflows/secret-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PATTERN: azure-terraform/alz-module-catalog/patterns/terraform-azurerm-compeer-secret-lifecycle
      ROOT: azure-terraform/alz-module-catalog/implementations/platform-lz/workspaces/platform-secret-lifecycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Runtime dependencies and tests
        run: |
          python -m pip install --require-hashes -r "$PATTERN/runtime/requirements.lock.txt"
          python -m pip check
          cd "$PATTERN/runtime"
          python -m unittest discover -s tests -v
      - name: Terraform format validation and mocked tests
        run: |
          terraform fmt -check -recursive "$PATTERN" "$ROOT"
          for path in "$PATTERN" "$PATTERN/modules/vault-enrollment" "$PATTERN/modules/native-lifecycle" "$PATTERN/modules/governance" "$ROOT"; do
            terraform -chdir="$path" init -backend=false -input=false
            terraform -chdir="$path" validate
            terraform -chdir="$path" test
          done
      - name: Build Linux deployment artifact
        run: |
          mkdir -p "$RUNNER_TEMP/rotation-artifacts"
          bash "$PATTERN/runtime/build.sh" "$RUNNER_TEMP/rotation-artifacts/rotation.zip"
          sha256sum "$RUNNER_TEMP/rotation-artifacts/rotation.zip" > "$RUNNER_TEMP/rotation-artifacts/rotation.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: secret-lifecycle-runtime
          path: ${{ runner.temp }}/rotation-artifacts/
